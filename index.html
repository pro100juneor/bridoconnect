<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="canonical" href="https://bridoconnect.vercel.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="BridoConnect" />

    <meta property="og:url" content="https://bridoconnect.vercel.app/" />
    <meta property="og:locale" content="uk_UA" />

    <meta property="og:locale:alternate" content="de_DE" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BridoConnect — P2P гуманітарна платформа" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Alternate languages -->
    <link rel="alternate" hreflang="uk" href="https://bridoconnect.vercel.app/?lang=uk" />
    <link rel="alternate" hreflang="en" href="https://bridoconnect.vercel.app/?lang=en" />

    <link rel="alternate" hreflang="x-default" href="https://bridoconnect.vercel.app/" />

    <!-- PWA -->
    <meta name="theme-color" content="#c0392b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data — Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://bridoconnect.vercel.app/#org",
            "name": "BridoConnect",
            "legalName": "Luftarbeiter GmbH",
            "url": "https://bridoconnect.vercel.app/",
            "logo": "https://bridoconnect.vercel.app/apple-touch-icon.png",
            "sameAs": [
              "https://twitter.com/bridoconnect",
              "https://www.facebook.com/bridoconnect",
              "https://www.instagram.com/bridoconnect"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "DE",
              "addressLocality": "Auerbach"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@bridoconnect.com",
              "availableLanguage": ["uk", "en", "de"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://bridoconnect.vercel.app/#website",
            "url": "https://bridoconnect.vercel.app/",
            "name": "BridoConnect",
            "publisher": { "@id": "https://bridoconnect.vercel.app/#org" },
            "inLanguage": ["uk", "en", "de"],
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://bridoconnect.vercel.app/app/search?q={search_term}",
              "query-input": "required name=search_term"
            }
          }
        ]
      }
    </script>
