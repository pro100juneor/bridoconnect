name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build needs *some* values; placeholders are fine for type/bundle check.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy_key_for_ci_build_only

      - name: Test
        run: npm test

      # GF-1: зависимостный гейт. high допускаем (остался vite 5→8 мажор), critical — блокируем.
      - name: Dependency audit (high — informational)
        run: npm audit --audit-level=high || true
      - name: Dependency audit (critical — blocking)
        run: npm audit --audit-level=critical
