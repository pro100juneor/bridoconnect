# --- Security headers map (Supabase + Sentry + PostHog + Stripe + PayPal + Runway + ElevenLabs allowlist) ---
map $sent_http_content_type $csp_header {
  default "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com https://*.sentry.io https://*.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api.paypal.com https://*.sentry.io https://*.i.posthog.com https://api.elevenlabs.io https://api.runwayml.com; frame-src 'self' https://js.stripe.com https://www.paypal.com https://checkout.stripe.com https://*.sumsub.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- Health & meta ----
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location = /robots.txt { access_log off; try_files $uri =404; }
  location = /sitemap.xml { access_log off; try_files $uri =404; add_header Content-Type application/xml; }
  location = /manifest.json { try_files $uri =404; add_header Content-Type application/manifest+json; }

  # ---- Hashed asset bundles (Vite) — long cache, immutable ----
  location ~* ^/assets/.+\.(js|css|woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ---- Static media (может ротироваться, поэтому короче) ----
  location ~* \.(png|jpe?g|gif|svg|ico|webp|mp4|webm|mp3|wav|ogg)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
  }

  # ---- SPA fallback (React Router) ----
  location / {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy $csp_header always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    try_files $uri $uri/ /index.html;
  }

  # ---- 404 for hidden files ----
  location ~ /\. { deny all; access_log off; log_not_found off; }
}
